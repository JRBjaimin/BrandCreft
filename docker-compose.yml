services:
  postgres:
    image: postgres:16-alpine
    container_name: brandcraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: brandcraft
      POSTGRES_PASSWORD: brandcraft
      POSTGRES_DB: brandcraft
    ports:
      - "5432:5432"
    volumes:
      - brandcraft-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandcraft -d brandcraft"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: brandcraft-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - brandcraft-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: brandcraft-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: brandcraft
      MINIO_ROOT_PASSWORD: brandcraft
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - brandcraft-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 brandcraft brandcraft &&
      mc mb --ignore-existing local/brandcraft-media &&
      mc anonymous set download local/brandcraft-media/public &&
      exit 0
      "

volumes:
  brandcraft-postgres:
  brandcraft-redis:
  brandcraft-minio:
